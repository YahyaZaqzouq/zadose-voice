name: Arabic voiceover

on:
  push:
    branches: [main]
    paths: ['script.json', 'voiceover.py', '.github/workflows/voiceover.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate voiceover
        shell: bash
        run: |
          set -o pipefail
          which ffprobe || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          { pip install -q edge-tts && python voiceover.py; } 2>&1 | tee tts.log
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add out
          git commit -m "Voiceover audio" || echo "no changes"
          git pull --rebase -q origin main && git push
